# ==========================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ==========================================================
spring.application.name=viajes-reservas-api
server.port=8080

# ==========================================================
# BASE DE DATOS: XAMPP MySQL / MariaDB
# Nota: En este entorno XAMPP corre sobre el puerto 3307.
# Si en otra máquina corre en 3306, solo cambia 3307 por 3306.
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3307/viajes_farsheen_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ==========================================================
# CONFIGURACIÓN JPA / HIBERNATE
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# DOCUMENTACIÓN OPENAPI (SWAGGER UI)
# Acceso: http://localhost:8080/swagger-ui.html
# ==========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
